<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MomentMap - Event Calendar</title>
    <meta name="theme-color" content="#4f46e5">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- HEADER -->
    <header class="header">
        <h1>MomentMap</h1>
        <p id="appSubtitle">Plan your events. Remember every moment.</p>
        <label class="language-picker" for="languageSelect">Language:
            <select id="languageSelect">
                <option value="en">English</option>
                <option value="ur">اردو</option>
            </select>
        </label>
    </header>

    <div class="container">
        <p id="connectionStatus" class="connection-status" role="status" aria-live="polite"></p>

        <!-- SEARCH BAR -->
        <div class="search-section">
            <input 
                type="text" 
                id="searchInput" 
                class="search-box" 
                placeholder="Search events by name or date..."
                aria-label="Search events by name or date"
            >
        </div>

        <!-- FORM TO ADD NEW EVENT -->
        <section class="form-section">
            <h2 id="addEventHeading">Add a New Event</h2>
            <form id="eventForm">
                <!-- Event Name Input -->
                <div class="form-group">
                    <label for="eventName" id="eventNameLabel">Event Name:</label>
                    <input 
                        type="text" 
                        id="eventName" 
                        placeholder="Enter event name"
                        required
                    >
                </div>

                <!-- Event Date Input -->
                <div class="form-group">
                    <label for="eventDate" id="eventDateLabel">Event Date:</label>
                    <input 
                        type="date" 
                        id="eventDate"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="eventLocation" id="eventLocationLabel">Location:</label>
                    <input type="text" id="eventLocation" placeholder="e.g. Community Hall">
                </div>

                <div class="form-group">
                    <label for="eventCategory" id="eventCategoryLabel">Category:</label>
                    <select id="eventCategory">
                        <option value="">Select a category</option>
                        <option value="community">Community</option>
                        <option value="education">Education</option>
                        <option value="arts">Arts &amp; culture</option>
                        <option value="sports">Sports</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="eventStartTime" id="eventStartTimeLabel">Start time:</label>
                    <input type="time" id="eventStartTime">
                </div>

                <div class="form-group">
                    <label for="eventEndTime" id="eventEndTimeLabel">End time:</label>
                    <input type="time" id="eventEndTime">
                </div>

                <div class="form-group">
                    <label for="eventLink" id="eventLinkLabel">Event or registration link:</label>
                    <input type="url" id="eventLink" placeholder="https://example.com">
                </div>

                <!-- Event Description Input -->
                <div class="form-group" id="eventDescriptionGroup">
                    <label for="eventDescription" id="eventDescriptionLabel">Event Description:</label>
                    <textarea 
                        id="eventDescription" 
                        placeholder="Enter event description"
                        rows="4"
                        required
                    ></textarea>
                </div>

                <fieldset class="accessibility-options">
                    <legend id="accessibilityLegend">Accessibility Features Available</legend>
                    <label><input type="checkbox" name="accessibility" value="ramp"><span data-accessibility-label="ramp">Ramp / step-free access</span></label>
                    <label><input type="checkbox" name="accessibility" value="sign-language"><span data-accessibility-label="sign-language">Sign-language interpreter</span></label>
                    <label><input type="checkbox" name="accessibility" value="captions"><span data-accessibility-label="captions">Captions</span></label>
                    <label><input type="checkbox" name="accessibility" value="quiet-room"><span data-accessibility-label="quiet-room">Quiet room</span></label>
                    <label><input type="checkbox" name="accessibility" value="prayer-space"><span data-accessibility-label="prayer-space">Prayer space</span></label>
                </fieldset>

                <fieldset class="volunteer-options">
                    <legend id="volunteerLegend">Volunteer Shift (Optional)</legend>
                    <div class="form-group">
                        <label for="volunteerRole" id="volunteerRoleLabel">Role:</label>
                        <input type="text" id="volunteerRole" placeholder="e.g. Registration desk">
                    </div>
                    <div class="form-group">
                        <label for="volunteerCount" id="volunteerCountLabel">Volunteers needed:</label>
                        <input type="number" id="volunteerCount" min="1" max="100" placeholder="e.g. 3">
                    </div>
                    <div class="shift-times">
                        <div class="form-group">
                            <label for="volunteerStart" id="volunteerStartLabel">Start:</label>
                            <input type="time" id="volunteerStart">
                        </div>
                        <div class="form-group">
                            <label for="volunteerEnd" id="volunteerEndLabel">End:</label>
                            <input type="time" id="volunteerEnd">
                        </div>
                    </div>
                </fieldset>

                <!-- Submit Button -->
                <button type="submit" class="btn-add" id="addEventButton">Add Event</button>
                <button type="button" class="btn-cancel" id="cancelEditButton" hidden>Cancel editing</button>
            </form>

            <!-- Warning message (appears when form is incomplete) -->
            <div id="warningMessage" class="warning-message"></div>
        </section>

        <!-- EVENTS LIST SECTION -->
        <section class="events-section">
            <h2 id="eventsHeading">Find Accessible Events</h2>
            <div class="backup-controls">
                <button type="button" class="btn-export" id="exportEventsButton">Download event backup</button>
                <p id="backupStatus" role="status" aria-live="polite"></p>
            </div>
            <fieldset class="accessibility-filter">
                <legend id="filterLegend">Show events with all selected features</legend>
                <label><input type="checkbox" name="accessibility-filter" value="ramp"><span data-accessibility-label="ramp">Ramp / step-free access</span></label>
                <label><input type="checkbox" name="accessibility-filter" value="sign-language"><span data-accessibility-label="sign-language">Sign-language interpreter</span></label>
                <label><input type="checkbox" name="accessibility-filter" value="captions"><span data-accessibility-label="captions">Captions</span></label>
                <label><input type="checkbox" name="accessibility-filter" value="quiet-room"><span data-accessibility-label="quiet-room">Quiet room</span></label>
                <label><input type="checkbox" name="accessibility-filter" value="prayer-space"><span data-accessibility-label="prayer-space">Prayer space</span></label>
            </fieldset>
            <div id="eventsList" class="events-container">
                <!-- Events will be added here by JavaScript -->
            </div>
        </section>
    </div>

    <!-- FOOTER -->
    <footer class="footer">
        <p id="footerText">&copy; 2026 MomentMap. All rights reserved.</p>
    </footer>

    <!-- Link JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
